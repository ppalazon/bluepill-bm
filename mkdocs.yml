site_name: Blue Pill Bare-Metal
copyright: Copyright &copy; 2026 Pablo Palazón
docs_dir: docs

extra:
  generator: true

nav:
  - Home: index.md
  - Workflow:
      - Overview: workflow/overview.md
      - Source documents: workflow/source-documents.md
      - Identify the target: workflow/target-identification.md
      - Extract hardware facts: workflow/extracting-hardware-facts.md
      - Bring-up checklist: workflow/bring-up-checklist.md
  - Architecture:
      - Memory map: targets/stm32f103c8t6/memory-map.md
      - Reset and interrupts: architecture/reset-and-interrupts.md
      - Clocks: architecture/clocks.md
      - Linker and startup: architecture/linker-startup.md
  - STM32F103C8T6:
      - Target profile: targets/stm32f103c8t6/target-profile.md
      - Board: targets/stm32f103c8t6/board.md
      - Pinout: targets/stm32f103c8t6/pinout.md
      - Device restrictions and errata: targets/stm32f103c8t6/errata.md
  - Project:
      - Build process: project/build-process.md
  - Peripherals:
      - GPIO: peripherals/gpio.md
      - ADC: peripherals/adc.md
      - Timers: peripherals/timers.md
      - USART: peripherals/usart.md
      - SysTick: peripherals/systick.md
  - Applications:
      - Bare blink: applications/bare-blink.md
  - Development models:
      - C development models: development-models/abstraction-layers.md
      - Direct-register C: development-models/direct-registers.md
      - CMSIS: development-models/cmsis.md
  - Reference:
      - Acronyms: reference/acronyms.md
      - PDFs:
          - CKS32F103x Datasheet: refs/CKS32F103x.pdf
          - CKS32F103x Reference Manual: refs/CKS32F103x8-reference-manual.pdf
          - STM32F103x8 Datasheet: refs/stm32f103x8-datasheet.pdf
          - STM32F103x8 Reference Manual: refs/stm32f103x8-reference.pdf
          - ARM Cortex-M3 User Guide: refs/arm-cortex-m3-generic-user-guide.pdf

theme:
  name: material
  palette:
    primary: blue grey
    accent: orange
  font:
    text: Saira
    code: JetBrains Mono
  features:
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom

plugins:
  - search
  - mermaid2
