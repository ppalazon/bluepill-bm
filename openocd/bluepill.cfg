# This file is the local OpenOCD config for this Blue Pill project.
# It combines OpenOCD's standard ST-Link adapter config with its STM32F1 target
# config, then adds the small options needed for this board/probe combination.

# [find ...] searches OpenOCD's installed script directory. On this system these
# files resolve to:
# /usr/share/openocd/scripts/interface/stlink.cfg
# /usr/share/openocd/scripts/target/stm32f1x.cfg

# Configure the USB debug adapter. This works with many cheap ST-Link V2 clones.
source [find interface/stlink.cfg]

# Use SWD instead of JTAG. Blue Pill boards normally expose SWDIO and SWCLK.
transport select hla_swd

# Your board/probe reported this Cortex-M3 debug ID. The default STM32F1 config
# expected a different value, so this tells OpenOCD to accept the detected ID.
set CPUTAPID 0x2ba01477

# Configure the STM32F1 target family. This gives OpenOCD the flash programming,
# reset, breakpoint, and memory details for STM32F103-style devices.
source [find target/stm32f1x.cfg]

# Keep reset handling simple. Many cheap ST-Link clones are wired only with
# SWDIO, SWCLK, GND, and 3.3V, without a dedicated NRST reset connection.
reset_config none
