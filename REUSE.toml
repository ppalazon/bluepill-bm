version = 1

[[annotations]]
path = [
    ".clang-format",
    ".clangd",
    ".gitignore",
    ".gitmodules",
    ".nvim.lua",
    ".pre-commit-config.yaml",
    "AGENTS.md",
    "Makefile",
    "README.md",
    "apps/.clangd",
    "docs/**/*.md",
    "docs/**/*.png",
    "drivers/cmsis/.clangd",
    "include/.clangd",
    "mise.toml",
    "mkdocs.yml",
    "openocd/bluepill.cfg",
    "requirements.txt",
    "src/.clangd",
    "vendor/README.md",
]
precedence = "override"
SPDX-FileCopyrightText = "Pablo Palazon (Phyxor)"
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = ["**/*.c", "**/*.h", "**/*.s", "**/*.S", "linker/*.ld"]
precedence = "closest"
SPDX-FileCopyrightText = "Pablo Palazon (Phyxor)"
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = "docs/refs/*.pdf"
precedence = "override"
SPDX-FileCopyrightText = "Copyright holders named in each document"
SPDX-License-Identifier = "LicenseRef-ThirdParty-Documentation"
